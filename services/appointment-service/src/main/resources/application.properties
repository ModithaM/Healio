server.port=0

application-title=Appointment-Service

spring.application.name=appointment-service

spring.config.import=configserver:http://localhost:8888/

# Suppress Hibernate dialect deprecation warning
spring.jpa.properties.hibernate.dialect.storage_engine=
spring.jpa.properties.hibernate.dialect=

# Disable open-in-view warning (safe for microservices)
spring.jpa.open-in-view=false

# Suppress Spring Cloud LoadBalancer cache warning
spring.cloud.loadbalancer.cache.enabled=true
spring.cloud.loadbalancer.cache.ttl=30

paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
appointment.default-consultation-fee=${APPOINTMENT_DEFAULT_CONSULTATION_FEE:50.00}
appointment.default-currency=${APPOINTMENT_DEFAULT_CURRENCY:USD}
