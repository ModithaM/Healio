server.port=0

application-title=Telemedicine-Service

spring.application.name=telemedicine-service

spring.config.import=optional:file:../../.env[.properties],configserver:http://localhost:8888/


# Suppress Hibernate dialect deprecation warning
spring.jpa.properties.hibernate.dialect.storage_engine=
spring.jpa.properties.hibernate.dialect=

# Disable open-in-view warning (safe for microservices)
spring.jpa.open-in-view=false

# Suppress Spring Cloud LoadBalancer cache warning
spring.cloud.loadbalancer.cache.enabled=true
spring.cloud.loadbalancer.cache.ttl=30

# Agora credentials are service-level settings. Keep the actual certificate out of git.
telemedicine.agora.app-id=${AGORA_APP_ID:}
telemedicine.agora.app-certificate=${AGORA_APP_CERTIFICATE:}
telemedicine.agora.token-expiration-seconds=${AGORA_TOKEN_EXPIRATION_SECONDS:3600}
