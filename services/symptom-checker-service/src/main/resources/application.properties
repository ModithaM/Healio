server.port=0

spring.application.name=symptom-checker-service

spring.config.import=optional:file:../../.env[.properties],optional:configserver:http://localhost:8888/

# Database configuration (uses shared Healio PostgreSQL instance)
spring.datasource.url=jdbc:postgresql://localhost:5432/healio
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Google Gemini API (free tier - get key at https://aistudio.google.com/app/apikey)
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.model=gemini-1.5-flash
gemini.max-tokens=1024

spring.cloud.loadbalancer.cache.enabled=true
spring.cloud.loadbalancer.cache.ttl=30
