apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include overlays based on environment
# Usage: kustomize build k8s/overlays/dev | kubectl apply -f -
# Or: kubectl apply -k k8s/overlays/prod/

