apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: healio
  labels:
    app: discovery-service
    component: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
        component: infrastructure
    spec:
      containers:
      - name: discovery-service
        image: discovery-service:0.0.1-SNAPSHOT
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8761
          name: http
          protocol: TCP
        env:
        - name: SPRING_APPLICATION_NAME
          value: "discovery-service"
        - name: SERVER_PORT
          value: "8761"
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
          value: "false"
        - name: EUREKA_CLIENT_FETCH_REGISTRY
          value: "false"
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "true"
        - name: EUREKA_INSTANCE_HOSTNAME
          value: "discovery-service"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8761
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8761
          initialDelaySeconds: 20
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: healio
  labels:
    app: discovery-service
spec:
  type: LoadBalancer
  selector:
    app: discovery-service
  ports:
  - port: 8761
    targetPort: 8761
    protocol: TCP
    name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: discovery-service-pdb
  namespace: healio
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: discovery-service
