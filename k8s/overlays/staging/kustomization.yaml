apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: healio

resources:
  - ../../base
  - ../../database
  - ../../services/config-service
  - ../../services/discovery-service
  - ../../services/auth-service
  - ../../services/user-service
  - ../../services/patient-service
  - ../../services/doctor-service
  - ../../services/appointment-service
  - ../../services/telemedicine-service
  - ../../services/notification-service
  - ../../services/symptom-checker-service
  - ../../services/gateway
  - ../../frontend

# Staging-specific labels
commonLabels:
  environment: staging

# Patches for staging environment
replicas:
  - name: config-service
    count: 2
  - name: discovery-service
    count: 2
  - name: gateway
    count: 2
  - name: frontend
    count: 2
  - name: auth-service
    count: 2
  - name: user-service
    count: 2
  - name: patient-service
    count: 2
  - name: doctor-service
    count: 2
  - name: appointment-service
    count: 2
  - name: telemedicine-service
    count: 2
  - name: notification-service
    count: 2
  - name: symptom-checker-service
    count: 2

# Override config for staging
configMapGenerator:
  - name: healio-config
    behavior: merge
    literals:
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_HEALIO=INFO
