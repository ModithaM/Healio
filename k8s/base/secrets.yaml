apiVersion: v1
kind: Secret
metadata:
  name: healio-secrets
  namespace: healio
type: Opaque
stringData:
  # Base secret manifest intentionally contains no default credentials or API secrets.
  # Populate these values via an environment-specific overlay, secretGenerator/env file,
  # CI/CD injection, or an external secret manager before applying.

  # Database credentials
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_DATASOURCE_PASSWORD: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: ""

  # JWT configuration
  JWT_SECRET: ""
  JWT_EXPIRATION_MS: ""

  # External API keys
  AGORA_APP_ID: ""
  AGORA_APP_CERTIFICATE: ""
  AGORA_TOKEN_EXPIRATION_SECONDS: ""

  GEMINI_API_KEY: ""

  PAYPAL_CLIENT_ID: ""
  PAYPAL_CLIENT_SECRET: ""
  PAYPAL_BASE_URL: ""

  # Git configuration for Config Server
  GIT_USERNAME: ""
  GIT_PASSWORD: ""
  GIT_REPO: ""
