apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: healio

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml

# Common labels applied to all resources
commonLabels:
  app: healio
  managed-by: kustomize

# Common annotations
commonAnnotations:
  description: "Healio - AI-Enabled Smart Healthcare Platform"
  managed-by: "kustomize"
