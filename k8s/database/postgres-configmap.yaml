apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: healio
data:
  init-schemas.sql: |
    CREATE SCHEMA IF NOT EXISTS healio;
    
    -- Create users table
    CREATE TABLE IF NOT EXISTS healio.users (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        email VARCHAR(255) NOT NULL UNIQUE,
        password_hash VARCHAR(255) NOT NULL,
        full_name VARCHAR(255),
        phone VARCHAR(20),
        role VARCHAR(50) DEFAULT 'USER',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create patient profiles table
    CREATE TABLE IF NOT EXISTS healio.patient_profiles (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES healio.users(id),
        date_of_birth DATE,
        gender VARCHAR(10),
        blood_type VARCHAR(5),
        medical_history TEXT,
        allergies TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create doctor profiles table
    CREATE TABLE IF NOT EXISTS healio.doctor_profiles (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES healio.users(id),
        specialization VARCHAR(255),
        license_number VARCHAR(100) NOT NULL UNIQUE,
        experience_years INTEGER,
        availability_status VARCHAR(50) DEFAULT 'AVAILABLE',
        consultation_fee DECIMAL(10, 2),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create appointments table
    CREATE TABLE IF NOT EXISTS healio.appointments (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        patient_id UUID NOT NULL REFERENCES healio.users(id),
        doctor_id UUID NOT NULL REFERENCES healio.users(id),
        appointment_datetime TIMESTAMP NOT NULL,
        appointment_type VARCHAR(50) DEFAULT 'GENERAL',
        status VARCHAR(50) DEFAULT 'SCHEDULED',
        notes TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create telemedicine sessions table
    CREATE TABLE IF NOT EXISTS healio.telemedicine_sessions (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        appointment_id UUID NOT NULL REFERENCES healio.appointments(id),
        session_token VARCHAR(500),
        start_time TIMESTAMP,
        end_time TIMESTAMP,
        status VARCHAR(50) DEFAULT 'SCHEDULED',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create notifications table
    CREATE TABLE IF NOT EXISTS healio.notifications (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES healio.users(id),
        title VARCHAR(255),
        message TEXT,
        notification_type VARCHAR(50),
        is_read BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    CREATE INDEX idx_users_email ON healio.users(email);
    CREATE INDEX idx_patient_user_id ON healio.patient_profiles(user_id);
    CREATE INDEX idx_doctor_user_id ON healio.doctor_profiles(user_id);
    CREATE INDEX idx_appointments_patient_id ON healio.appointments(patient_id);
    CREATE INDEX idx_appointments_doctor_id ON healio.appointments(doctor_id);
    CREATE INDEX idx_appointments_status ON healio.appointments(status);
    CREATE INDEX idx_notifications_user_id ON healio.notifications(user_id);
    CREATE INDEX idx_notifications_is_read ON healio.notifications(is_read);
